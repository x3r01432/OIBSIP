<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temperature Converter</title><link rel="stylesheet" href="style.css"></head>
<body><main class="card">
<h1>Temperature Converter</h1>
<label for="value">Value</label>
<input type="text" id="value" placeholder="Enter a number">
<label for="unit">From unit</label>
<select id="unit"><option value="C">Celsius</option><option value="F">Fahrenheit</option><option value="K">Kelvin</option></select>
<button id="convertBtn">Convert</button>
<p id="error" class="error"></p>
<div id="results" class="results"></div>
</main><script src="script.js"></script></body></html>
