<svg xmlns="http://www.w3.org/2000/svg" width="800" height="2000" viewBox="0 0 800 2000"><rect width="800" height="2000" fill="#F1F5F9"/><rect width="800" height="250" fill="#14213D"/><text x="50" y="80" font-family="Poppins" font-weight="600" font-size="20" fill="#FCA311" letter-spacing="3">GLOBAL ELECTRICITY · 2000 – 2024</text><text font-family="Poppins" font-weight="800" font-size="58" fill="#F1F5F9"><tspan x="46" y="150">The Power Shift</tspan></text><text x="50" y="200" font-family="Inter" font-size="22" fill="#F1F5F9" opacity=".85">How the world’s electricity mix changed in 24 years</text><circle cx="68" cy="312" r="20" fill="#FCA311"/><text x="68" y="320" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="20" fill="#14213D">1</text><text x="102" y="320" font-family="Poppins" font-weight="700" font-size="28" fill="#14213D">Renewables’ share keeps climbing</text><line x1="90" x2="740" y1="580.0" y2="580.0" stroke="#14213D" stroke-opacity=".12"/><text x="80" y="585.0" text-anchor="end" font-family="Inter" font-size="14" fill="#14213D">15%</text><line x1="90" x2="740" y1="530.0" y2="530.0" stroke="#14213D" stroke-opacity=".12"/><text x="80" y="535.0" text-anchor="end" font-family="Inter" font-size="14" fill="#14213D">20%</text><line x1="90" x2="740" y1="480.0" y2="480.0" stroke="#14213D" stroke-opacity=".12"/><text x="80" y="485.0" text-anchor="end" font-family="Inter" font-size="14" fill="#14213D">25%</text><line x1="90" x2="740" y1="430.0" y2="430.0" stroke="#14213D" stroke-opacity=".12"/><text x="80" y="435.0" text-anchor="end" font-family="Inter" font-size="14" fill="#14213D">30%</text><line x1="90" x2="740" y1="380.0" y2="380.0" stroke="#14213D" stroke-opacity=".12"/><text x="80" y="385.0" text-anchor="end" font-family="Inter" font-size="14" fill="#14213D">35%</text><polygon points="90,580 90.0,542.8 117.1,549.6 144.2,550.9 171.2,555.6 198.3,550.2 225.4,549.0 252.5,547.7 279.6,550.3 306.7,540.9 333.8,535.3 360.8,532.8 387.9,529.8 415.0,