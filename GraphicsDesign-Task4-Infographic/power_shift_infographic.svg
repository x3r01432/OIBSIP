14213D">6.9%</text><circle cx="68" cy="1782" r="20" fill="#FCA311"/><text x="68" y="1790" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="20" fill="#14213D">5</text><text x="102" y="1790" font-family="Poppins" font-weight="700" font-size="28" fill="#14213D">…while total demand doubled</text><text x="50" y="1840" font-family="Inter" font-size="19" fill="#14213D">World generation: <tspan font-weight="700">15,279 TWh</tspan> (2000) → <tspan font-weight="700" fill="#2A9D8F">30,930 TWh</tspan> (2024), ×2.02</text><rect y="1880" width="800" height="120" fill="#14213D"/><text x="50" y="1918" font-family="Inter" font-size="13" fill="#F1F5F9">Sources: Our World in Data — Energy dataset (owid/energy-data, github.com/owid/energy-data), based on Ember (2025)</text><text x="50" y="1940" font-family="Inter" font-size="13" fill="#F1F5F9">and Energy Institute — Statistical Review of World Energy (2025). Series: World, shares of electricity generation;</text><text x="50" y="1962" font-family="Inter" font-size="13" fill="#F1F5F9">solar_electricity, wind_electricity, electricity_generation (TWh). Shares may not sum to 100% due to rounding / “other”.</text><text x="750" y="1985" text-anchor="end" font-family="Poppins" font-weight="600" font-size="13" fill="#FCA311">Design: Steven Manuel Rios · OIBSIP</text></svg>