<!DOCTYPE html><html><head><meta charset="utf-8"><title>#{{room}}</title>
<style>body{font-family:sans-serif;max-width:600px;margin:1rem auto}#log{border:1px solid #ccc;height:60vh;overflow-y:auto;padding:.5rem}.me{color:#0a58ca}</style></head>
<body><h2>#{{room}} <small><a href="/rooms">rooms</a> · <a href="/logout">logout</a></small></h2>
<div id="log"></div><form id="f"><input id="m" style="width:80%" placeholder="Message (try :smile: :rocket:)" autocomplete="off"><button>Send</button></form>
<script>
const room="{{room}}", me="{{user}}"; let last=0, loaded=false;
if ("Notification" in window && Notification.permission==="default") Notification.requestPermission();
function add(m){const d=document.createElement('div');d.className=m.username===me?'me':'';d.textContent=`[${m.ts}] ${m.username}: ${m.body}`;log.appendChild(d);log.scrollTop=log.scrollHeight;
  if(loaded && m.username!==me && document.hidden && "Notification" in window && Notification.permission==="granted") new Notification(`${m.username} in #${room}`,{body:m.body});}
async function poll(){try{const r=await fetch(`/api/${room}/messages?after=${last}&wait=${loaded?1:0}`);const ms=await r.json();
  ms.forEach(add); if(ms.length) last=ms[ms.length-1].id; loaded=true;}catch(e){await new Promise(r=>setTimeout(r,2000));}
  poll();}
f.onsubmit=async e=>{e.preventDefault();if(!m.value.trim())return;await fetch(`/api/${room}/send`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({body:m.value})});m.value='';};
poll();
</script></body></html>
